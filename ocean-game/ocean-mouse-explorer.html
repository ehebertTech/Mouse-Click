<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ocean Mouse Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');

  :root{
    --sky-top:#BFEFFF;
    --sky-bottom:#8FD9F2;
    --water-top:#5EC3E0;
    --water-bottom:#2E93B8;
    --sand:#F3D9A4;
    --sand-dark:#E2C088;
    --ink:#1F4A57;
    --card:#FFFFFF;
    --coral:#FF7A5C;
    --coral-dark:#E65E42;
    --shell:#FFC1CC;
    --shell-dark:#F49AAA;
    --bubble:#DFF6FF;
    --bubble-edge:#8FE0F5;
    --star:#FFD166;
    --star-dark:#E8B23D;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka',sans-serif;}

  body{
    background:linear-gradient(var(--sky-top), var(--sky-bottom) 40%);
    position:relative;
    user-select:none;
  }

  #water{
    position:absolute; bottom:0; left:0; width:100%; height:52%;
    background:linear-gradient(var(--water-top), var(--water-bottom));
  }
  #water::before{
    content:''; position:absolute; top:-14px; left:0; width:200%; height:28px;
    background:radial-gradient(circle, var(--water-top) 48%, transparent 50%);
    background-size:60px 28px;
    animation:wave 6s linear infinite;
  }
  @keyframes wave{ from{ transform:translateX(0);} to{ transform:translateX(-60px);} }

  #sand{
    position:absolute; bottom:0; left:0; width:100%; height:9%;
    background:var(--sand);
    border-top:6px solid var(--sand-dark);
  }

  header{
    position:relative; z-index:5;
    text-align:center; padding:20px 10px 6px;
  }
  h1{
    margin:0; font-size:2.1rem; color:#0F3140;
    text-shadow: 0 2px 0 rgba(255,255,255,0.5);
  }
  #subtitle{
    margin:6px 0 0; font-size:1.15rem; color:#0F3140; font-weight:500;
    min-height:1.4em;
  }

  #trail{
    display:flex; justify-content:center; gap:18px; margin-top:10px;
  }
  .trail-dot{
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.7);
    border:3px solid rgba(255,255,255,0.9);
    display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; transition:transform .25s ease, background .25s ease;
  }
  .trail-dot.done{ background:var(--star); transform:scale(1.15); }
  .trail-dot.active{ border-color:var(--coral-dark); transform:scale(1.2); }

  #stage{
    position:relative;
    width:min(880px, 94vw);
    height:min(520px, 60vh);
    margin:12px auto 0;
    background:rgba(255,255,255,0.35);
    border-radius:28px;
    border:4px solid rgba(255,255,255,0.85);
    overflow:hidden;
  }

  .target{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  /* Round 1: swim to shells */
  .shell-spot{
    width:100px; height:100px; border-radius:50%;
    background:rgba(255,193,204,0.2);
    border:4px dashed var(--shell-dark);
    font-size:44px;
    transition:transform .15s ease, background .15s ease;
  }
  .shell-spot.near{ background:rgba(255,193,204,0.4); transform:scale(1.05); }
  .shell-spot.reached{
    background:var(--shell);
    border-style:solid;
    animation:pop .35s ease;
  }

  #fish{
    position:absolute; font-size:44px; pointer-events:none;
    transform:translate(-50%,-50%) scaleX(-1);
    transition:transform .05s linear;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,0.2));
    z-index:10;
  }

  /* Round 2: floating bubbles to click */
  .float-bubble{
    width:74px; height:74px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95), var(--bubble) 65%, var(--bubble-edge));
    box-shadow:0 4px 10px rgba(0,0,0,0.12), inset 0 0 12px rgba(255,255,255,0.7);
    position:absolute;
    cursor:pointer;
    transition:transform .1s ease;
  }
  .float-bubble:hover{ transform:scale(1.06); }
  .float-bubble.popped{ animation:pop-out .3s ease forwards; pointer-events:none; }

  /* Round 3: click the starfish (precision) */
  .starfish-spot{
    width:64px; height:64px; font-size:46px;
    transition:transform .1s ease;
  }
  .starfish-spot:hover{ transform:scale(1.1); }
  .starfish-spot.found{
    animation:pop-out .3s ease forwards;
    pointer-events:none;
  }

  @keyframes pop{
    0%{ transform:scale(0.8); }
    60%{ transform:scale(1.2); }
    100%{ transform:scale(1); }
  }
  @keyframes pop-out{
    0%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(1.6); opacity:0; }
  }

  #confetti-layer{
    position:fixed; inset:0; pointer-events:none; z-index:50;
  }
  .confetto{
    position:absolute; top:-20px; width:14px; height:14px; border-radius:3px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(400deg); }
  }

  #end-card{
    position:fixed; inset:0; z-index:60;
    display:none; align-items:center; justify-content:center;
    background:rgba(94,195,224,0.55);
    backdrop-filter:blur(2px);
  }
  #end-card.show{ display:flex; }
  #end-card .box{
    background:var(--card); padding:36px 44px; border-radius:26px;
    text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.15);
    border:4px solid var(--star);
  }
  #end-card h2{ margin:0 0 8px; font-size:2rem; color:#0F3140; }
  #end-card p{ margin:0 0 20px; font-size:1.15rem; color:#0F3140; }
  #restart{
    font-family:'Fredoka',sans-serif; font-size:1.15rem; font-weight:600;
    padding:12px 28px; border-radius:40px; border:none;
    background:var(--coral); color:white; cursor:pointer;
    box-shadow:0 4px 0 var(--coral-dark);
  }
  #restart:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--coral-dark); }

  footer{
    position:relative; text-align:center; margin-top:8px; color:#0F3140;
    font-size:0.95rem; opacity:0.85;
  }

  #sound-toggle{
    position:absolute; top:22px; left:24px; z-index:20;
    width:52px; height:52px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.9);
    background:rgba(255,255,255,0.7);
    font-size:1.5rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>

<div id="water"></div>
<div id="sand"></div>
<button id="sound-toggle" aria-label="Toggle sound" title="Toggle sound">🔊</button>

<header>
  <h1>Ocean Mouse Explorer</h1>
  <div id="subtitle">Move the mouse to guide the fish to each shell!</div>
  <div id="trail">
    <div class="trail-dot active" id="dot-1">🐟</div>
    <div class="trail-dot" id="dot-2">🫧</div>
    <div class="trail-dot" id="dot-3">⭐</div>
  </div>
</header>

<div id="stage"></div>
<footer>Round 1 practices moving. Rounds 2 and 3 practice clicking.</footer>

<div id="confetti-layer"></div>
<div id="end-card">
  <div class="box">
    <h2>You did it! 🎉</h2>
    <p>You moved and clicked like a pro explorer!</p>
    <button id="restart">Play again</button>
  </div>
</div>

<script>
/* ---------- SOUND ENGINE (synthesized, no audio files needed) ---------- */
let audioCtx = null;
let soundOn = true;

function getCtx(){
  if (!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, startTime, duration, {type='sine', gain=0.18, glideTo=null} = {}){
  if (!soundOn) return;
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, startTime + duration);
  g.gain.setValueAtTime(0, startTime);
  g.gain.linearRampToValueAtTime(gain, startTime + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(g).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}

function playMove(){
  const ctx = getCtx();
  tone(500, ctx.currentTime, 0.06, {type:'triangle', gain:0.06});
}
function playShellReached(){
  const ctx = getCtx();
  const t = ctx.currentTime;
  tone(660, t, 0.16, {type:'sine', gain:0.2});
  tone(880, t + 0.08, 0.18, {type:'sine', gain:0.18});
}
function playBubblePop(){
  const ctx = getCtx();
  tone(340, ctx.currentTime, 0.12, {type:'sine', gain:0.2, glideTo:980});
}
function playStarfishFound(){
  const ctx = getCtx();
  const t = ctx.currentTime;
  tone(784, t, 0.12, {type:'sine', gain:0.18});
  tone(1047, t + 0.09, 0.16, {type:'sine', gain:0.16});
}
function playStageComplete(){
  const ctx = getCtx();
  const t = ctx.currentTime;
  [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i*0.11, 0.22, {type:'sine', gain:0.18}));
}
function playFinale(){
  const ctx = getCtx();
  const t = ctx.currentTime;
  const notes = [523, 659, 784, 1047, 784, 1047, 1319];
  notes.forEach((f, i) => tone(f, t + i*0.13, 0.3, {type:'sine', gain:0.17}));
}

function unlockAudioOnce(){
  getCtx();
  document.removeEventListener('mousedown', unlockAudioOnce);
  document.removeEventListener('touchstart', unlockAudioOnce);
}
document.addEventListener('mousedown', unlockAudioOnce);
document.addEventListener('touchstart', unlockAudioOnce);

const soundBtn = document.getElementById('sound-toggle');
soundBtn.addEventListener('click', () => {
  getCtx();
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
});

const stage = document.getElementById('stage');
const subtitle = document.getElementById('subtitle');
const dots = [document.getElementById('dot-1'), document.getElementById('dot-2'), document.getElementById('dot-3')];

function setActiveDot(i){
  dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
}
function markDone(i){
  dots[i].classList.add('done');
  dots[i].classList.remove('active');
}
function clearStage(){ stage.innerHTML = ''; }

/* ---------- ROUND 1: MOVING ---------- */
function startRound1(){
  setActiveDot(0);
  subtitle.textContent = "Move the mouse to guide the fish to each shell!";
  clearStage();

  const spots = [
    {x:0.16,y:0.28}, {x:0.8,y:0.22}, {x:0.5,y:0.75}, {x:0.22,y:0.7}, {x:0.78,y:0.68}
  ];
  let reached = 0;

  const fish = document.createElement('div');
  fish.id = 'fish';
  fish.textContent = '🐟';
  stage.appendChild(fish);

  const spotEls = spots.map((s) => {
    const el = document.createElement('div');
    el.className = 'target shell-spot';
    el.textContent = '🐚';
    stage.appendChild(el);
    return {el, s};
  });

  function layout(){
    const r = stage.getBoundingClientRect();
    spotEls.forEach(({el, s}) => {
      el.style.left = (s.x * r.width - 50) + 'px';
      el.style.top = (s.y * r.height - 50) + 'px';
    });
  }
  layout();
  window.addEventListener('resize', layout);

  let lastFacing = -1;
  let lastX = null;

  function onMove(e){
    const r = stage.getBoundingClientRect();
    const mx = e.clientX - r.left;
    const my = e.clientY - r.top;

    if (lastX !== null){
      const dir = mx > lastX ? 1 : (mx < lastX ? -1 : lastFacing);
      if (dir !== lastFacing){
        fish.style.transform = `translate(-50%,-50%) scaleX(${dir === 1 ? 1 : -1})`;
        lastFacing = dir;
      }
    }
    lastX = mx;

    fish.style.left = mx + 'px';
    fish.style.top = my + 'px';

    spotEls.forEach(({el, s}) => {
      if (el.classList.contains('reached')) return;
      const cx = s.x * r.width, cy = s.y * r.height;
      const dist = Math.hypot(mx - cx, my - cy);
      if (dist < 60){
        el.classList.remove('near');
        el.classList.add('reached');
        playShellReached();
        reached++;
        if (reached === spots.length){
          stage.removeEventListener('mousemove', onMove);
          burstConfetti(12);
          playStageComplete();
          setTimeout(() => { markDone(0); startRound2(); }, 500);
        }
      } else if (dist < 110){
        if (!el.classList.contains('near')) playMove();
        el.classList.add('near');
      } else {
        el.classList.remove('near');
      }
    });
  }
  stage.addEventListener('mousemove', onMove);
}

/* ---------- ROUND 2: FLOATING BUBBLES TO CLICK ---------- */
function startRound2(){
  setActiveDot(1);
  subtitle.textContent = "Click each bubble before it floats away!";
  clearStage();

  const TOTAL = 10;
  let popped = 0;
  let spawned = 0;
  let spawnTimer = null;

  function spawnBubble(){
    if (spawned >= TOTAL) { clearInterval(spawnTimer); return; }
    spawned++;
    const r = stage.getBoundingClientRect();
    const size = 60 + Math.random() * 30;
    const el = document.createElement('div');
    el.className = 'float-bubble';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    const startX = 20 + Math.random() * (r.width - size - 40);
    el.style.left = startX + 'px';
    el.style.top = (r.height + size) + 'px';
    stage.appendChild(el);

    const duration = 3800 + Math.random() * 1400;
    const drift = (Math.random() - 0.5) * 80;
    const start = performance.now();

    function animate(now){
      if (!el.isConnected) return;
      const t = (now - start) / duration;
      if (t >= 1){
        el.remove();
        return;
      }
      const y = r.height + size - t * (r.height + size * 2);
      const x = startX + Math.sin(t * Math.PI * 2) * drift * 0.3 + drift * t;
      el.style.top = y + 'px';
      el.style.left = x + 'px';
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    el.addEventListener('click', () => {
      if (el.classList.contains('popped')) return;
      el.classList.add('popped');
      playBubblePop();
      popped++;
      setTimeout(() => el.remove(), 300);
      checkDone();
    });
  }

  function checkDone(){
    if (popped === TOTAL){
      burstConfetti(16);
      playStageComplete();
      setTimeout(() => { markDone(1); startRound3(); }, 500);
    }
  }

  spawnBubble();
  spawnTimer = setInterval(spawnBubble, 900);
}

/* ---------- ROUND 3: FIND THE STARFISH (precision clicking) ---------- */
function startRound3(){
  setActiveDot(2);
  subtitle.textContent = "Click each starfish hiding in the sand!";
  clearStage();

  const spots = [
    {x:0.1,y:0.2}, {x:0.32,y:0.55}, {x:0.55,y:0.15}, {x:0.75,y:0.4},
    {x:0.9,y:0.75}, {x:0.2,y:0.82}, {x:0.62,y:0.7}
  ];
  let found = 0;

  spots.forEach((s) => {
    const el = document.createElement('div');
    el.className = 'target starfish-spot';
    el.textContent = '⭐';
    stage.appendChild(el);

    function place(){
      const r = stage.getBoundingClientRect();
      el.style.left = (s.x * r.width - 32) + 'px';
      el.style.top = (s.y * r.height - 32) + 'px';
    }
    place();
    window.addEventListener('resize', place);

    el.addEventListener('click', () => {
      if (el.classList.contains('found')) return;
      el.classList.add('found');
      playStarfishFound();
      found++;
      if (found === spots.length){
        burstConfetti(24);
        playFinale();
        setTimeout(showEnd, 500);
      }
    });
  });
}

/* ---------- CONFETTI + END ---------- */
function burstConfetti(n){
  const layer = document.getElementById('confetti-layer');
  const colors = ['#FF7A5C','#FFD166','#DFF6FF','#5EC3E0','#FFC1CC'];
  for (let i = 0; i < n; i++){
    const c = document.createElement('div');
    c.className = 'confetto';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
    layer.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

function showEnd(){
  document.getElementById('end-card').classList.add('show');
}

document.getElementById('restart').addEventListener('click', () => {
  document.getElementById('end-card').classList.remove('show');
  dots.forEach(d => d.classList.remove('done','active'));
  startRound1();
});

startRound1();
</script>
</body>
</html>
